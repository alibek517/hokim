<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SafeTrace Free Map</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #0F172A; }
        .custom-popup { font-family: sans-serif; font-size: 13px; font-weight: bold; color: #1E293B; }
    </style>
    <script src="leaflet.js"></script>
    <script type="text/javascript">
        var map = null;
        var marker = null;
        var pendingCoords = null;

        function initMap() {
            var startCoords = pendingCoords ? pendingCoords : [41.8456, 60.3912]; // Gurlan tuman markazi
            map = L.map('map', {
                zoomControl: true,
                attributionControl: false
            }).setView(startCoords, 16);

            // Mutlaqo tekin va ochiq xaritalar (OpenStreetMap va CARTO)
            var osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                maxZoom: 19,
                attribution: '© OpenStreetMap'
            });

            var cartoLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                maxZoom: 19,
                attribution: '© CARTO'
            });

            // Asosiy qatlam sifatida OSM ni faollashtirish
            osmLayer.addTo(map);

            var baseMaps = {
                "Oddiy xarita (OSM)": osmLayer,
                "Topografik (CARTO)": cartoLayer
            };
            L.control.layers(baseMaps).addTo(map);

            marker = L.marker(startCoords).addTo(map);
            marker.bindPopup("<div class='custom-popup'>📍 Xodim joylashuvi</div>").openPopup();

            if (pendingCoords) {
                updateLocation(pendingCoords[0], pendingCoords[1]);
            }
        }

        function updateLocation(lat, lon) {
            var latNum = parseFloat(lat);
            var lonNum = parseFloat(lon);
            if (isNaN(latNum) || isNaN(lonNum)) return;

            var coords = [latNum, lonNum];
            if (map && marker) {
                map.setView(coords, 17, { animate: true });
                marker.setLatLng(coords);
            } else {
                pendingCoords = coords;
            }
        }

        window.onload = initMap;
    </script>
</head>
<body>
    <div id="map"></div>
</body>
</html>
