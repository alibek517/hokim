<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SafeTrace Xarita</title>
    <link rel="stylesheet" href="leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #F8FAFC;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 100%;
            min-height: 240px;
            background-color: #E2E8F0;
        }
        .pulse-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .pulse-pin {
            width: 32px;
            height: 32px;
            filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35));
        }
        .pulse-wave {
            position: absolute;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(220, 38, 38, 0.35);
            animation: pulse-ring 1.8s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            z-index: -1;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 0.9; }
            100% { transform: scale(1.8); opacity: 0; }
        }
        .custom-popup {
            font-size: 13px;
            font-weight: 700;
            color: #0F172A;
            text-align: center;
            padding: 2px 4px;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 10px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
        }
    </style>
    <script src="leaflet.js"></script>
    <script type="text/javascript">
        var map = null;
        var marker = null;
        var pendingCoords = null;
        var customIcon = null;

        /*DEFAULT_COORDS*/

        function createCustomIcon() {
            if (typeof L === 'undefined') return null;
            return L.divIcon({
                className: 'pulse-marker',
                html: '<div class="pulse-wave"></div>' +
                      '<svg class="pulse-pin" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                      '<path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2Z" fill="#DC2626"/>' +
                      '<circle cx="12" cy="9" r="3.5" fill="#FFFFFF"/>' +
                      '</svg>',
                iconSize: [32, 32],
                iconAnchor: [16, 32],
                popupAnchor: [0, -32]
            });
        }

        function initMap() {
            if (map) return;
            try {
                if (typeof L === 'undefined') {
                    console.warn('Leaflet L is not ready, waiting...');
                    setTimeout(initMap, 100);
                    return;
                }

                customIcon = createCustomIcon();
                var startCoords = pendingCoords ? pendingCoords : [41.8456, 60.3912];

                map = L.map('map', {
                    zoomControl: true,
                    attributionControl: false
                }).setView(startCoords, 16);

                // 1. Google Standart qatlami (O'zbekiston hududi uchun tez va aniq)
                var googleStandard = L.tileLayer('https://mt{s}.google.com/vt/lyrs=m&hl=uz&x={x}&y={y}&z={z}', {
                    subdomains: ['0', '1', '2', '3'],
                    maxZoom: 20,
                    attribution: 'Google'
                });

                // 2. Google Hybrid (Sun'iy yo'ldosh + yo'llar)
                var googleHybrid = L.tileLayer('https://mt{s}.google.com/vt/lyrs=y&hl=uz&x={x}&y={y}&z={z}', {
                    subdomains: ['0', '1', '2', '3'],
                    maxZoom: 20,
                    attribution: 'Google Satellite'
                });

                // 3. OpenStreetMap
                var osmLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: 'OpenStreetMap'
                });

                // 4. CARTO Voyager
                var cartoLayer = L.tileLayer('https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}@2x.png', {
                    maxZoom: 19,
                    attribution: 'CARTO'
                });

                googleStandard.addTo(map);

                var baseMaps = {
                    "Google Standart": googleStandard,
                    "Sun'iy yo'ldosh": googleHybrid,
                    "OpenStreetMap": osmLayer,
                    "CARTO Voyager": cartoLayer
                };
                L.control.layers(baseMaps).addTo(map);

                marker = L.marker(startCoords, { icon: customIcon }).addTo(map);
                marker.bindPopup("<div class='custom-popup'>📍 Xodim jonli joylashuvi</div>");

                if (pendingCoords) {
                    updateLocation(pendingCoords[0], pendingCoords[1]);
                } else {
                    marker.openPopup();
                }

                forceResize();
            } catch (e) {
                console.error('Map init error:', e);
            }
        }

        function forceResize() {
            if (!map) return;
            map.invalidateSize();
            setTimeout(function() { if (map) map.invalidateSize(); }, 100);
            setTimeout(function() { if (map) map.invalidateSize(); }, 300);
            setTimeout(function() { if (map) map.invalidateSize(); }, 600);
            setTimeout(function() { if (map) map.invalidateSize(); }, 1200);
            setTimeout(function() { if (map) map.invalidateSize(); }, 2500);
        }

        function updateLocation(lat, lon) {
            try {
                var latNum = parseFloat(lat);
                var lonNum = parseFloat(lon);
                if (isNaN(latNum) || isNaN(lonNum)) return;

                var coords = [latNum, lonNum];
                if (map && marker) {
                    map.setView(coords, 17, { animate: true });
                    marker.setLatLng(coords);
                    marker.openPopup();
                    map.invalidateSize();
                } else {
                    pendingCoords = coords;
                    if (!map) initMap();
                }
            } catch(e) {
                console.error('updateLocation error:', e);
            }
        }

        window.addEventListener('resize', forceResize);
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMap);
        } else {
            initMap();
        }
        window.addEventListener('load', function() {
            initMap();
            forceResize();
        });
    </script>
</head>
<body>
    <div id="map"></div>
</body>
</html>
